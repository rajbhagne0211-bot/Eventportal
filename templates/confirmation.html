<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Confirmation — ASTRA FEST 2026</title>
<style>
:root{--or:#e8732a;--mar:#7a1f2b;--ch:#2a2328;--ln:#e6d5bd}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--ch);background:linear-gradient(#2a1a3a 0%,#7a1f2b 38%,#e8732a 72%,#ffc27a 100%) fixed;min-height:100vh}
nav{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(42,35,40,.75)}
nav a{color:#fff;text-decoration:none;padding:10px 14px}nav .logo{color:#ffd9a0;font-weight:800;letter-spacing:.12em}
main{max-width:820px;margin:20px auto 50px;padding:0 14px}
.ticket{background:#fffaf0;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.top{background:var(--mar);color:#ffd9a0;padding:18px 22px}.top h1{margin:0;font-size:1.6rem;letter-spacing:.1em}.top p{margin:4px 0 0;color:#fff;font-size:.9rem}
.body{display:flex;gap:20px;padding:22px;flex-wrap:wrap}.info{flex:1;min-width:260px}.qr{text-align:center;width:170px;margin:0 auto}.qr img{width:160px;height:160px;border:1px solid var(--ln);padding:6px;background:#fff}
.lbl{font-size:.7rem;letter-spacing:.12em;color:#7b6d60;margin-top:12px}.code{font-size:2rem;font-weight:800;color:var(--mar);letter-spacing:.06em;margin:0}
table{width:100%;border-collapse:collapse;margin-top:10px}td{padding:6px 4px;border-bottom:1px solid var(--ln);vertical-align:top}td:first-child{font-weight:700;width:38%}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.8rem;color:#fff}
.b-paid,.b-confirmed{background:#1b6e2f}.b-pending,.b-waitlisted{background:#b26a00}.b-failed,.b-rejected,.b-cancelled,.b-refunded{background:#b00020}.b-not_required{background:#555}
.foot{padding:12px 22px 18px;font-size:.9rem;border-top:2px dashed var(--ln)}
.warn{background:#fde7ea;border-left:4px solid #b00020;padding:10px 12px;margin:12px 22px;border-radius:6px}
.note{background:#fff0dc;border-left:4px solid var(--or);padding:10px 12px;margin:12px 0;border-radius:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{padding:12px 18px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;min-height:44px;background:#eadfce;color:var(--ch);display:inline-flex;align-items:center}
.btn.pri{background:var(--mar);color:#fff}
.reup{background:#fff;border-radius:12px;padding:14px;margin-top:16px}
@media print{@page{size:A4;margin:12mm}body{background:#fff}nav,.actions,.noprint,.reup{display:none!important}main{margin:0;max-width:none;padding:0}.ticket{box-shadow:none;border:1px solid #999;border-radius:8px}.top,.badge{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<nav class="noprint"><span class="logo">ASTRA FEST 2026</span><a href="/">Home</a></nav>
<main>
<div id="out" aria-live="polite">Loading your confirmation…</div>
<div class="actions noprint" id="actions" hidden>
 <button class="btn pri" onclick="print()">Print Confirmation</button>
 <button class="btn" id="pdf">Download as PDF</button>
 <a class="btn" id="verify" href="#">Verify Registration</a>
 <a class="btn" href="/">Return to Home</a>
</div>
<div id="reup" class="noprint"></div>
</main>
{% raw %}
<script>
const ID=location.pathname.split('/').pop(),SECRET=new URLSearchParams(location.hash.slice(1)).get('t')||'',API='/api/astra';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H={'X-Registration-Token':SECRET};
const PAY={paid:'PAID',pending:'PAYMENT PENDING',failed:'PAYMENT FAILED',not_required:'NO FEE',cancelled:'PAYMENT CANCELLED',refunded:'REFUNDED'};
let tries=0,timer=null;
async function load(){
 if(!SECRET){out.innerHTML='<div class="warn">This link is missing its access key. Open the link exactly as you received it.</div>';return}
 try{const r=await fetch(`${API}/registrations/${ID}/confirmation`,{headers:H});
  if(!r.ok){out.innerHTML='<div class="warn">We could not find this registration with that link.</div>';return}
  show(await r.json())}
 catch(e){out.innerHTML='<div class="warn">Network error. <a href="">Try again</a></div>'}}
function show(c){
 const d=new Date(c.registered_on).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
 const team=c.format==='team',unpaid=c.payment_status==='pending'||c.payment_status==='failed';
 const stText=c.status==='pending'&&unpaid?'PENDING PAYMENT':c.status.toUpperCase();
 const row=(k,v)=>v?`<tr><td>${k}</td><td>${esc(v)}</td></tr>`:'';
 out.innerHTML=`<article class="ticket"><div class="top"><h1>ASTRA FEST 2026</h1><p>Mumbai Meri Jaan · ${esc(c.college_name)}</p></div>
 ${unpaid?'<div class="warn"><b>Payment is not confirmed.</b> This is not a paid ticket until the payment status shows PAID.</div>':''}
 <div class="body"><div class="info"><div class="lbl">REGISTRATION CODE</div><p class="code">${esc(c.reg_code)}</p>
 <table>${row('Event',c.event)}${row('Category',c.category+(c.subcategory?' · '+c.subcategory:''))}${row('Format',team?'Team':'Individual')}
 ${row(team?'Team name':'Participant',team?c.team_name:c.lead_name)}${team?row('Team captain',c.lead_name)+row('Participants',String(c.participant_count)):''}
 ${row('College',c.college)}${row('Department',c.department)}${row('Registered on',d)}
 <tr><td>Payment</td><td><span class="badge b-${esc(c.payment_status)}">${esc(PAY[c.payment_status]||c.payment_status)}</span>${c.fee>0?' ₹'+esc(c.fee):''}</td></tr>
 <tr><td>Registration</td><td><span class="badge b-${unpaid&&c.status==='pending'?'pending':esc(c.status)}">${esc(stText)}</span></td></tr></table></div>
 <div class="qr"><img alt="Verification QR code" src="/qr/${encodeURIComponent(c.verification_token)}.svg"><div class="lbl">SCAN TO VERIFY</div></div></div>
 <div class="foot">Please bring this printed confirmation to the event.</div></article>
 ${c.documents_pending?'<div class="note noprint">Your ID document is awaiting verification by the committee.</div>':''}`;
 document.getElementById('actions').hidden=false;
 document.getElementById('verify').href='/verify/'+encodeURIComponent(c.verification_token);
 if(c.payment_status==='pending'&&tries++<24){clearTimeout(timer);timer=setTimeout(load,5000)}   /* webhook can arrive late */
 if(c.documents_rejected)loadRejected()}
document.getElementById('pdf').onclick=async()=>{
 try{const r=await fetch(`${API}/registrations/${ID}/confirmation.pdf`,{headers:H});if(!r.ok)throw 0;
  const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ASTRA-confirmation.pdf';a.click();URL.revokeObjectURL(a.href)}
 catch(e){alert('Could not create the PDF. Please use Print and choose “Save as PDF”.')}};
async function loadRejected(){
 const r=await fetch(`${API}/registrations/${ID}/documents`,{headers:H});if(!r.ok)return;
 const rej=(await r.json()).documents.filter(d=>d.status==='rejected');
 document.getElementById('reup').innerHTML=rej.length?'<div class="reup"><b>A document was rejected — please upload a replacement</b>'+rej.map(d=>`<p>${esc(d.participant_name||'Registration')} · ${esc(d.doc_type)}<br><small>Reason: ${esc(d.review_notes||'not specified')}</small><br><input type="file" accept=".jpg,.jpeg,.png,.pdf" data-p="${esc(d.participant_id||'')}" data-t="${esc(d.doc_type)}"><span></span></p>`).join('')+'</div>':'';
 document.querySelectorAll('#reup input').forEach(i=>i.onchange=async()=>{const sp=i.nextElementSibling;sp.textContent=' Uploading…';
  const fd=new FormData();fd.append('file',i.files[0]);fd.append('doc_type',i.dataset.t);if(i.dataset.p)fd.append('participant_id',i.dataset.p);
  try{const x=await fetch(`${API}/registrations/${ID}/documents`,{method:'POST',headers:H,body:fd});const j=await x.json();sp.textContent=x.ok?' ✔ uploaded — awaiting review':' '+(j.error||'failed');if(x.ok)setTimeout(load,800)}catch(e){sp.textContent=' Network error'}})}
const out=document.getElementById('out');load();
</script>
{% endraw %}
</body></html>
